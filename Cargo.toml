[package]
name = "takumi_py"
version = "0.3.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies]
image = { version = "0.25", default-features = false }
pyo3 = { version = "0.30.1", default-features = false, features = ["extension-module", "abi3-py311"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-pyobject = "0.8.0"
takumi = { version = "2.17.1", path = "takumilib/takumi", features = ["from-html", "svg-backend"] }
takumi-core = { version = "0.32.0", path = "takumilib/takumi-core" }

[lints.clippy]
redundant_closure_for_method_calls = "deny"

[lints.clippy.all]
level = "deny"
priority = -1
