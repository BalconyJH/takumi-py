[package]
name = "takumi_py"
version = "0.4.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies]
cssparser = "0.38"
image = { version = "0.25", default-features = false }
pyo3 = { version = "0.30.1", default-features = false, features = ["extension-module", "abi3-py311", "macros"] }
serde = { version = "1.0.228", features = ["derive"] }
takumi = { version = "2.20.0", path = "takumilib/takumi", features = ["from-html", "svg-backend"] }
takumi-core = { version = "0.36.0", path = "takumilib/takumi-core" }
takumi-bindings-common = { path = "takumilib/takumi-bindings-common" }

[lints.clippy]
redundant_closure_for_method_calls = "deny"

[lints.clippy.all]
level = "deny"
priority = -1
