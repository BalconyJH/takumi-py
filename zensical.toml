[project]
site_name = "takumi-py"
site_description = "Python bindings for the Takumi Rust renderer"
site_author = "BalconyJH"
site_url = "https://balconyjh.github.io/takumi-py/"
repo_url = "https://github.com/BalconyJH/takumi-py"
repo_name = "BalconyJH/takumi-py"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
copyright = "Copyright &copy; 2026 takumi-py contributors"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started/index.md",
    { "Installation" = "getting-started/installation.md" },
    { "Quickstart" = "getting-started/quickstart.md" },
  ] },
  { "Guides" = [
    "guides/index.md",
    { "Rendering model" = "guides/rendering.md" },
    { "Fonts and images" = "guides/resources.md" },
    { "Jinja templates" = "guides/templates.md" },
    { "Animation" = "guides/animation.md" },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "Support matrix" = "reference/support.md" },
    { "Exceptions" = "reference/exceptions.md" },
    { "Python API" = [
      { "Renderer" = "reference/api/renderer.md" },
      { "Options and resources" = "reference/api/options.md" },
      { "Nodes and results" = "reference/api/types.md" },
      { "HTML parsing" = "reference/api/html.md" },
      { "Templates" = "reference/api/templates.md" },
    ] },
  ] },
  { "Migration" = [
    "migration/index.md",
    { "Takumi v2" = "migration/takumi-v2.md" },
  ] },
  { "Maintainers" = [
    "maintainers/index.md",
    { "Development" = "maintainers/development.md" },
    { "Documentation" = "maintainers/documentation.md" },
    { "Releasing" = "maintainers/releasing.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "search.suggest",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra.version]
provider = "mike"
default = "latest"
alias = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["python"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
members_order = "source"
separate_signature = true
show_if_no_docstring = true
show_root_heading = true
show_signature_annotations = true
show_source = false

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
