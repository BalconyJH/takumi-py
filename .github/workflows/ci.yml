name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
          version: "0.11.29"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          components: rustfmt,clippy
          rustflags: ""

      - name: Sync dependencies
        run: uv sync --locked --group dev --group test

      - name: Run checks
        run: make check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - quality
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
          version: "0.11.29"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          rustflags: ""

      - name: Sync documentation dependencies
        run: uv sync --locked --group docs

      - name: Build documentation
        run: make docs-build

  sdist-smoke:
    name: Sdist smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - quality
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
          version: "0.11.29"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          rustflags: ""

      - name: Sync build dependencies
        run: uv sync --locked --group dev

      - name: Build sdist
        run: uv run --group dev maturin sdist --out dist

      - name: Validate sdist
        run: >-
          python3 .github/scripts/check-distributions.py
          --version "$(uv version --short)"
          dist/takumi_py-*.tar.gz

      - name: Build wheel from sdist
        run: uv build --wheel dist/takumi_py-*.tar.gz --out-dir dist/from-sdist

      - name: Validate wheel built from sdist
        run: >-
          python3 .github/scripts/check-distributions.py
          --version "$(uv version --short)"
          dist/from-sdist/*.whl

      - name: Smoke test wheel built from sdist
        run: |
          python -m pip install --upgrade pip
          python .github/scripts/install-built-wheel.py dist/from-sdist
          python .github/scripts/smoke-wheel.py

  wheel-smoke:
    name: Wheel smoke (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    needs:
      - quality
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
            manylinux: "2014"
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2014"
          - name: macos-aarch64
            runner: macos-15
            target: aarch64
          - name: windows-x64
            runner: windows-latest
            target: x64

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: ".python-version"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          maturin-version: v1.14.1
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          args: --release --locked --out dist --compatibility pypi
          sccache: true

      - name: Smoke test built wheel
        run: |
          python -m pip install --upgrade pip
          python .github/scripts/install-built-wheel.py dist
          python .github/scripts/smoke-wheel.py
