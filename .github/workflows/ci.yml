name: Check · Build and test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: Enable extra debug diagnostics
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Release · Tag joins every trusted main push by its exact SHA.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Run source checks before the expensive packaging matrix. Then sdist and wheels
  # run in parallel; ABI3 consumes the completed wheel matrix's Linux release wheel.
  # result explicitly joins every layer, including failures, cancellations and skips.
  quality:
    name: Run checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-suffix: quality-${{ github.event_name }}
          version: "0.12.1"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt,clippy
          rustflags: ""

      - name: Show runner context
        run: |
          echo "Runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          python --version
          uv --version
          rustc --version

      - name: Sync dependencies
        run: uv sync --locked --group dev --group test --extra math

      - name: Show dependency snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        run: |
          uv pip list
          uv tree --locked
          cargo tree --locked

      - name: Run checks
        run: make check

  sdist-smoke:
    name: Build and smoke-test sdist
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs:
      - quality
    env:
      BUILD_LOG: sdist-build.log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-suffix: sdist-${{ github.event_name }}
          version: "0.12.1"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""

      - name: Sync build dependencies
        run: uv sync --locked --group dev

      - name: Build sdist
        shell: bash
        run: |
          set -o pipefail
          uv run --group dev maturin sdist --out dist 2>&1 | tee "${BUILD_LOG}"

      - name: Verify sdist in isolation
        run: >-
          python3 .github/scripts/verify-distributions.py dist
          --sdist-only
          --math
          --expected-version "$(uv version --short)"
          --python "$(cat .python-version)"
          --uv uv

      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload sdist build log
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-sdist-build-log
          path: ${{ env.BUILD_LOG }}
          if-no-files-found: warn
          retention-days: 14

  wheel-smoke:
    name: Build and test wheel (${{ matrix.platform.name }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    needs:
      - quality
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
            manylinux: "2014"
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2014"
          # A musllinux wheel cannot install on the glibc runner, so its smoke test
          # runs in an Alpine container.
          - name: musllinux-x86_64
            runner: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
            container: python:3.11.17-alpine3.24@sha256:5fb4bc53dd0180955e31e5245b648bbb24a4ac4ab03a1de81513642325220bcd
          - name: musllinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: musllinux_1_2
            container: python:3.11.17-alpine3.24@sha256:5fb4bc53dd0180955e31e5245b648bbb24a4ac4ab03a1de81513642325220bcd
          - name: macos-aarch64
            runner: macos-15
            target: aarch64
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64
          - name: windows-x64
            runner: windows-latest
            target: x64
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-suffix: wheel-${{ matrix.platform.name }}-${{ github.event_name }}
          version: "0.12.1"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          args: ${{ matrix.profile == 'release' && '--release' || '--profile dev' }} --locked --out dist --compatibility pypi
          sccache: true

      - name: Verify wheel in isolation
        if: ${{ !matrix.platform.container }}
        shell: bash
        run: >-
          python .github/scripts/verify-distributions.py dist
          --wheel-only
          --math
          --expected-version "$(uv version --short)"
          --python "$(cat .python-version)"
          --uv uv

      - name: Verify wheel in an Alpine container
        if: ${{ matrix.platform.container }}
        shell: bash
        env:
          CONTAINER_IMAGE: ${{ matrix.platform.container }}
        run: |
          docker run --rm --volume "${PWD}:/work" --workdir /work \
            --env EXPECTED_VERSION="$(uv version --short)" "${CONTAINER_IMAGE}" sh -euc '
              apk add --no-cache libgcc gcompat
              pip install --quiet --root-user-action=ignore uv==0.12.1
              LD_PRELOAD=/lib/libgcompat.so.0 python .github/scripts/verify-distributions.py dist \
                --wheel-only \
                --math \
                --expected-version "${EXPECTED_VERSION}" \
                --python "$(cat .python-version)" \
                --uv uv
            '

      - name: Run installed-wheel regression tests
        if: ${{ !matrix.platform.container }}
        shell: bash
        run: >-
          python .github/scripts/test-wheel.py dist
          --python "$(cat .python-version)"
          --uv uv
          --junit-xml reports/regressions.xml

      - name: Run installed-wheel regressions in Alpine
        if: ${{ matrix.platform.container }}
        shell: bash
        env:
          CONTAINER_IMAGE: ${{ matrix.platform.container }}
        run: |
          docker run --rm --volume "${PWD}:/work" --workdir /work \
            "${CONTAINER_IMAGE}" sh -euc '
              apk add --no-cache libgcc gcompat
              pip install --quiet --root-user-action=ignore uv==0.12.1
              LD_PRELOAD=/lib/libgcompat.so.0 python .github/scripts/test-wheel.py dist \
                --python "$(cat .python-version)" \
                --uv uv \
                --junit-xml reports/regressions.xml
            '

      - name: Upload regression results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-regressions-${{ matrix.platform.name }}-${{ matrix.profile }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload wheel
        if: ${{ matrix.profile == 'release' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-wheel-${{ matrix.platform.name }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  abi3-smoke:
    name: Smoke-test abi3 wheel (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      # A matrix dependency waits for every platform/profile, not one matrix cell.
      - wheel-smoke
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-suffix: abi3-${{ matrix.python-version }}-${{ github.event_name }}
          version: "0.12.1"

      - name: Download Linux wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-wheel-linux-x86_64
          path: dist

      - name: Verify abi3 wheel
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: >-
          python3 .github/scripts/verify-distributions.py dist
          --wheel-only
          --math
          --expected-version "$(uv version --short)"
          --python "${PYTHON_VERSION}"
          --uv uv

  result:
    name: Required checks
    if: ${{ always() }}
    # Keep all four direct needs: the summary below reads each layer's result.
    needs:
      - quality
      - sdist-smoke
      - wheel-smoke
      - abi3-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CI layer
        shell: bash
        env:
          ABI3_RESULT: ${{ needs.abi3-smoke.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SDIST_RESULT: ${{ needs.sdist-smoke.result }}
          WHEEL_RESULT: ${{ needs.wheel-smoke.result }}
        run: |
          failed=false
          {
            echo "### Required CI layers"
            echo
            echo "| Layer | Result |"
            echo "| --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"
          for layer in \
            "quality:${QUALITY_RESULT}" \
            "sdist-smoke:${SDIST_RESULT}" \
            "wheel-smoke:${WHEEL_RESULT}" \
            "abi3-smoke:${ABI3_RESULT}"; do
            name=${layer%%:*}
            result=${layer#*:}
            echo "| ${name} | ${result} |" >> "${GITHUB_STEP_SUMMARY}"
            if [[ "${result}" != "success" ]]; then
              echo "::error::${name} finished with ${result}; success is required."
              failed=true
            fi
          done
          if [[ "${failed}" == "true" ]]; then
            echo "::error::At least one required CI layer did not succeed."
            exit 1
          fi
          echo "All required CI layers succeeded."
