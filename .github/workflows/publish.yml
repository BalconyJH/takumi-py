name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish, for example v0.2.0rc1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-ref:
    name: Validate release ref
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release-ref.outputs.tag }}
      sha: ${{ steps.release-ref.outputs.sha }}
      version: ${{ steps.release-ref.outputs.version }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive

      - name: Validate tag and main ancestry
        id: release-ref
        shell: bash
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG}"
          if [[ ! "${tag}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+[A-Za-z0-9.-]*$ ]]; then
            echo "Release tag must start with vX.Y.Z, got ${tag}" >&2
            exit 1
          fi

          package_version="$(python3 - <<'PY'
          from pathlib import Path
          import re

          match = re.search(
              r'^version = "([^"]+)"$',
              Path("pyproject.toml").read_text(),
              re.MULTILINE,
          )
          if match is None:
              raise SystemExit("project.version is missing from pyproject.toml")
          print(match.group(1))
          PY
          )"
          expected_tag="v${package_version}"
          if [[ "${tag}" != "${expected_tag}" ]]; then
            echo "Release tag ${tag} does not match project version ${package_version}" >&2
            exit 1
          fi

          tag_commit="$(git rev-list -n 1 "${tag}")"
          if ! git rev-parse --verify origin/main >/dev/null; then
            echo "origin/main is not available in the checkout" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "Release tag ${tag} points to ${tag_commit}, which is not on origin/main" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "sha=${tag_commit}" >> "${GITHUB_OUTPUT}"
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"

  release-check:
    name: Release checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - validate-release-ref
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ needs.validate-release-ref.outputs.sha }}
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          components: rustfmt,clippy
          rustflags: ""

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Run checks
        run: make check

  wheels:
    name: Build wheels (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    needs:
      - validate-release-ref
      - release-check
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
            manylinux: "2014"
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2014"
          - name: macos-aarch64
            runner: macos-15
            target: aarch64
          - name: windows-x64
            runner: windows-latest
            target: x64

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ needs.validate-release-ref.outputs.sha }}
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: ".python-version"

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          maturin-version: v1.14.1
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          args: --release --locked --out dist --compatibility pypi
          sccache: true

      - name: Smoke test built wheel
        run: |
          python -m pip install --upgrade pip
          python .github/scripts/install-built-wheel.py dist
          python .github/scripts/smoke-wheel.py

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: distributions-${{ matrix.platform.name }}
          path: dist

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - validate-release-ref
      - release-check
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ needs.validate-release-ref.outputs.sha }}
          submodules: recursive

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: sdist
          maturin-version: v1.14.1
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: distributions-sdist
          path: dist

  provenance:
    name: Attest distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - wheels
      - sdist
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          pattern: distributions-*
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: dist/*

  pypi-publish:
    name: Deploy to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - validate-release-ref
      - wheels
      - sdist
      - provenance
    environment:
      name: release
      url: https://pypi.org/project/takumi-py/${{ needs.validate-release-ref.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          pattern: distributions-*
          merge-multiple: true

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist

  github-release:
    name: Publish to GitHub Releases
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - validate-release-ref
      - wheels
      - sdist
      - provenance
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.validate-release-ref.outputs.tag }}

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          pattern: distributions-*
          merge-multiple: true

      - name: Create release and upload distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release-ref.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi
