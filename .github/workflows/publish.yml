name: Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish (for example, v0.3.0)
        required: true
        type: string
      debug_enabled:
        description: Enable extra build diagnostics
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: publish-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release-guard:
    name: Gate release source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publishable: ${{ steps.contract.outputs.publish }}
      release_tag: ${{ steps.contract.outputs.tag }}
      source_sha: ${{ steps.contract.outputs.sha }}
      version: ${{ steps.contract.outputs.version }}
    steps:
      - name: Resolve the release tag
        id: release-ref
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG_INPUT}"
          if [[ "${REF_TYPE}" == "tag" ]]; then
            if [[ "${REF_NAME}" != "${TAG}" ]]; then
              echo "::error::Dispatch ref ${REF_NAME} does not match release_tag ${TAG}."
              exit 1
            fi
          elif [[ "${REF_TYPE}" == "branch" ]]; then
            if [[ "${REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
              echo "::error::Manual recovery must run from ${DEFAULT_BRANCH} or the matching tag."
              exit 1
            fi
          else
            echo "::error::Unsupported workflow_dispatch ref type: ${REF_TYPE}."
            exit 1
          fi
          if [[ "${TAG}" != v* ]] || ! git check-ref-format "refs/tags/${TAG}"; then
            echo "::error::Release tag must be a valid v* tag, got ${TAG}."
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release-ref.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: "0.12.1"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      - name: Fetch main
        run: >-
          git fetch --no-tags origin
          +refs/heads/main:refs/remotes/origin/main

      - name: Validate release contract
        id: contract
        env:
          RELEASE_TAG: ${{ steps.release-ref.outputs.tag }}
        run: >-
          python3 .github/scripts/validate-release.py
          --tag "${RELEASE_TAG}"
          --main-ref origin/main

  release-check:
    name: Recheck release source
    needs:
      - release-guard
    if: ${{ needs.release-guard.outputs.publishable == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-guard.outputs.source_sha }}
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: "0.12.1"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          components: rustfmt,clippy
          rustflags: ""

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Show dependency snapshot
        if: ${{ inputs.debug_enabled }}
        run: |
          uv tree --locked
          cargo tree --locked

      - name: Run project checks
        run: make check

      - name: Build documentation strictly
        run: make docs-build

  wheels:
    name: Build wheels (${{ matrix.platform.name }})
    needs:
      - release-guard
      - release-check
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
            manylinux: "2014"
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2014"
          - name: macos-aarch64
            runner: macos-15
            target: aarch64
          - name: windows-x64
            runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-guard.outputs.source_sha }}
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: "0.12.1"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          args: --release --locked --out dist --compatibility pypi
          sccache: false

      - name: Verify wheel in isolation
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-guard.outputs.version }}
        run: >-
          python .github/scripts/verify-distributions.py dist
          --wheel-only
          --expected-version "${RELEASE_VERSION}"
          --python "$(cat .python-version)"
          --uv uv

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions-${{ matrix.platform.name }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  sdist:
    name: Build sdist
    needs:
      - release-guard
      - release-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-guard.outputs.source_sha }}
          persist-credentials: false
          submodules: recursive

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          maturin-version: v1.14.1
          args: --out dist
          sccache: false

      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  artifact-validation:
    name: Validate distributions
    needs:
      - release-guard
      - wheels
      - sdist
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.release-guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-guard.outputs.source_sha }}
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: "0.12.1"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: distributions-*
          merge-multiple: true

      - name: Validate complete distribution set
        run: >-
          python3 .github/scripts/check-distributions.py
          --complete
          --version "${RELEASE_VERSION}"
          dist/*

      - name: Validate package metadata rendering
        run: uv run --no-project --with twine==6.2.0 twine check dist/*

      - name: Rebuild wheel from sdist
        run: uv build --wheel dist/takumi_py-*.tar.gz --out-dir dist-from-sdist

      - name: Verify rebuilt wheel in isolation
        run: >-
          python3 .github/scripts/verify-distributions.py dist-from-sdist
          --wheel-only
          --expected-version "${RELEASE_VERSION}"
          --python "$(cat .python-version)"
          --uv uv

  provenance:
    name: Attest distributions
    needs:
      - wheels
      - sdist
      - artifact-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: write # Store provenance for the exact release distributions.
      id-token: write # Sign provenance through GitHub's OIDC identity.
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: distributions-*
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*

  pypi-publish:
    name: Publish to PyPI
    needs:
      - release-guard
      - wheels
      - sdist
      - artifact-validation
      - provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://pypi.org/project/takumi-py/${{ needs.release-guard.outputs.version }}/
    permissions:
      id-token: write # Exchange OIDC for a short-lived PyPI credential.
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: distributions-*
          merge-multiple: true

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true

  verify-pypi:
    name: Verify PyPI distribution hashes
    needs:
      - release-guard
      - wheels
      - sdist
      - pypi-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      RELEASE_VERSION: ${{ needs.release-guard.outputs.version }}
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: distributions-*
          merge-multiple: true

      - name: Match PyPI filenames and SHA-256 digests
        shell: bash
        run: |
          set -euo pipefail
          metadata="${RUNNER_TEMP}/pypi-release.json"
          package_url="https://pypi.org/pypi/takumi-py/${RELEASE_VERSION}/json"

          for attempt in $(seq 1 12); do
            if ! curl --fail --silent --show-error --location \
              --output "${metadata}" "${package_url}"; then
              status=2
            else
              set +e
              python3 - "${metadata}" dist <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          import sys

          metadata_path = Path(sys.argv[1])
          dist_path = Path(sys.argv[2])
          local = {
              path.name: sha256(path.read_bytes()).hexdigest()
              for path in dist_path.iterdir()
              if path.name.endswith((".whl", ".tar.gz"))
          }
          payload = json.loads(metadata_path.read_text(encoding="utf-8"))
          remote = {
              entry["filename"]: entry["digests"]["sha256"]
              for entry in payload["urls"]
          }

          if local == remote:
              print(f"Verified {len(local)} PyPI distribution digest(s).")
              raise SystemExit(0)

          mismatched = {
              filename
              for filename in local.keys() & remote.keys()
              if local[filename] != remote[filename]
          }
          unexpected = remote.keys() - local.keys()
          if mismatched or unexpected:
              print(
                  "::error::PyPI contains mismatched or unexpected release files: "
                  f"mismatched={sorted(mismatched)}, unexpected={sorted(unexpected)}"
              )
              raise SystemExit(3)

          missing = local.keys() - remote.keys()
          print(f"PyPI metadata is not complete yet; missing={sorted(missing)}")
          raise SystemExit(2)
          PY
              status=$?
              set -e
            fi

            if [[ "${status}" == "0" ]]; then
              exit 0
            fi
            if [[ "${status}" == "3" ]]; then
              exit 1
            fi
            if [[ "${status}" != "2" ]]; then
              echo "::error::Unexpected PyPI verification failure (exit ${status})."
              exit 1
            fi
            if [[ "${attempt}" == "12" ]]; then
              echo "::error::PyPI metadata did not expose the complete release in time."
              exit 1
            fi
            sleep 5
          done

  github-release:
    name: Publish GitHub Release
    needs:
      - release-guard
      - wheels
      - sdist
      - verify-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Create or recover the verified GitHub Release.
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: distributions-*
          merge-multiple: true

      - name: Create, recover, or verify the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-guard.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.release-guard.outputs.source_sha }}
        run: |
          set -euo pipefail

          if ! gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --verify-tag \
              --target "${SOURCE_SHA}" \
              --title "${RELEASE_TAG}" \
              --generate-notes
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft=false
            exit 0
          fi

          release_is_draft=$(gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isDraft \
            --jq '.isDraft')
          remote_dist="${RUNNER_TEMP}/github-release-assets"
          mkdir -p "${remote_dist}"
          asset_count=$(gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets \
            --jq '.assets | length')
          if [[ "${asset_count}" -gt 0 ]]; then
            gh release download "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --dir "${remote_dist}"
          fi

          set +e
          python3 - dist "${remote_dist}" <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import sys

          def distributions(directory: Path) -> dict[str, str]:
              return {
                  path.name: sha256(path.read_bytes()).hexdigest()
                  for path in directory.iterdir()
                  if path.name.endswith((".whl", ".tar.gz"))
              }

          local = distributions(Path(sys.argv[1]))
          remote = distributions(Path(sys.argv[2]))
          if not local:
              print("No local release distributions were downloaded.")
              raise SystemExit(1)
          if local != remote:
              print(
                  "GitHub Release distribution mismatch: "
                  f"missing={sorted(local.keys() - remote.keys())}, "
                  f"unexpected={sorted(remote.keys() - local.keys())}, "
                  f"changed={sorted(name for name in local.keys() & remote.keys() if local[name] != remote[name])}"
              )
              raise SystemExit(1)
          print(f"Verified {len(local)} GitHub Release distribution digest(s).")
          PY
          assets_match=$?
          set -e

          if [[ "${assets_match}" != "0" && "${release_is_draft}" != "true" ]]; then
            echo "::error::Published GitHub Release assets differ from the verified distributions."
            exit 1
          fi
          if [[ "${assets_match}" != "0" ]]; then
            while IFS= read -r asset; do
              if [[ "${asset}" == *.whl || "${asset}" == *.tar.gz ]]; then
                gh release delete-asset "${RELEASE_TAG}" "${asset}" \
                  --repo "${GITHUB_REPOSITORY}" --yes
              fi
            done < <(gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets[].name')
            gh release upload "${RELEASE_TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}"
          fi
          if [[ "${release_is_draft}" == "true" ]]; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft=false
          fi

  docs-release:
    name: Publish versioned documentation
    needs:
      - release-guard
      - github-release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # Commit released documentation to gh-pages.
    env:
      DEPLOY_LOG: release-docs-deploy.log
      DOCS_LOG: release-docs-build.log
      RELEASE_TAG: ${{ needs.release-guard.outputs.release_tag }}
      VERSION: ${{ needs.release-guard.outputs.version }}
    steps:
      - name: Checkout the verified release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-guard.outputs.release_tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: "0.12.1"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      - name: Sync documentation dependencies
        run: uv sync --locked --group docs --no-default-groups

      - name: Build released docs strictly
        shell: bash
        run: |
          set -o pipefail
          make docs-build 2>&1 | tee "${DOCS_LOG}"

      - name: Upload released docs build log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-docs-build-log
          path: ${{ env.DOCS_LOG }}
          if-no-files-found: warn
          retention-days: 14

      - name: Configure deployment identity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Deploy released docs with conflict retry
        shell: bash
        run: |
          set -euo pipefail
          : > "${DEPLOY_LOG}"

          for attempt in 1 2 3; do
            echo "Deployment attempt ${attempt}/3" | tee -a "${DEPLOY_LOG}"
            git branch --delete --force gh-pages 2>/dev/null || true
            if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
              git fetch --force origin gh-pages:gh-pages
            fi

            versions_file="${RUNNER_TEMP}/mike-versions.json"
            if ! git show gh-pages:versions.json > "${versions_file}" 2>/dev/null; then
              echo '[]' > "${versions_file}"
            fi
            update_latest=$(uvx --from packaging==26.2 python - \
              "${VERSION}" "${versions_file}" <<'PY'
          import json
          from pathlib import Path
          import sys

          from packaging.version import Version

          target = Version(sys.argv[1])
          deployed = [
              Version(item["version"])
              for item in json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          ]
          newest = max(deployed) if deployed else None
          should_update = newest is None or target >= newest
          print(
              f"Target docs version={target}; newest deployed={newest}; "
              f"update latest={should_update}.",
              file=sys.stderr,
          )
          print("true" if should_update else "false")
          PY
            )

            deploy_succeeded=false
            if [[ "${update_latest}" == "true" ]]; then
              if uv run mike deploy --update-aliases "${VERSION}" latest 2>&1 | tee -a "${DEPLOY_LOG}" \
                && uv run mike set-default latest 2>&1 | tee -a "${DEPLOY_LOG}"; then
                deploy_succeeded=true
              fi
            elif uv run mike deploy "${VERSION}" 2>&1 | tee -a "${DEPLOY_LOG}"; then
              deploy_succeeded=true
            fi

            if [[ "${deploy_succeeded}" == "true" ]] \
              && git push origin gh-pages:gh-pages 2>&1 | tee -a "${DEPLOY_LOG}"; then
              exit 0
            fi
            if [[ "${attempt}" == "3" ]]; then
              echo "::error::Failed to deploy released docs after ${attempt} attempts."
              exit 1
            fi
            sleep "$((attempt * 2))"
          done

      - name: Upload released docs deployment log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-docs-deploy-log
          path: ${{ env.DEPLOY_LOG }}
          if-no-files-found: warn
          retention-days: 14

      - name: Show released docs URL
        env:
          DOCS_OWNER: ${{ github.repository_owner }}
          DOCS_REPO: ${{ github.event.repository.name }}
        run: |
          docs_url="https://${DOCS_OWNER}.github.io/${DOCS_REPO}/${VERSION}/"
          echo "Docs deployed from ${RELEASE_TAG}: ${docs_url}"
          echo "### [Open released documentation](${docs_url})" >> "${GITHUB_STEP_SUMMARY}"
