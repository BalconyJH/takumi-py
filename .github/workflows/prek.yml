name: Check · Lint

on:
  push:
    branches:
      - main
      - 0.4.x
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Release · Tag joins every trusted main push by its exact SHA.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prek:
    name: Run repository hooks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt,clippy
          rustflags: ""

      - name: Install prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          install-only: true
          prek-version: "0.5.7"

      - name: Run repository hooks
        run: prek run --all-files --show-diff-on-failure --color=always

      - name: Validate GitHub Actions workflows
        run: >-
          prek run actionlint --all-files --hook-stage=manual
          --show-diff-on-failure --color=always
