name: Check · Docs

on:
  push:
    branches:
      - main
      - 0.4.x
  pull_request:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: Enable extra debug diagnostics
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  # Release · Tag joins every trusted main push by its exact SHA.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      DOCS_LOG: docs-build.log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-suffix: docs-${{ github.event_name }}
          version: "0.12.1"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""

      - name: Show runner context
        run: |
          echo "Runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          python --version
          uv --version

      - name: Sync documentation dependencies
        run: uv sync --locked --group docs --no-default-groups

      - name: Show dependency snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        run: |
          uv pip list
          uv tree --locked

      - name: Build documentation
        shell: bash
        run: |
          set -o pipefail
          make docs-build 2>&1 | tee "${DOCS_LOG}"

      - name: Upload docs build log
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-build-log
          path: ${{ env.DOCS_LOG }}
          if-no-files-found: warn
          retention-days: 14
