name: Preview · Docs

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Only successful Check · Docs runs for pushes to main deploy, from their exact commit.
    workflows:
      - Check · Docs
    types:
      - completed
    branches:
      - main

permissions: {}

concurrency:
  # A newer main commit's preview supersedes one still in progress.
  group: docs-preview
  cancel-in-progress: true

jobs:
  gh-pages:
    name: Deploy dev documentation to gh-pages
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # Commit the dev documentation version to gh-pages.
    env:
      DEPLOY_LOG: preview-docs-deploy.log
    steps:
      - name: Checkout the verified main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          version: "0.12.1"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          rustflags: ""

      - name: Sync documentation dependencies
        run: uv sync --locked --group docs --no-default-groups

      - name: Configure deployment identity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Deploy the dev docs with conflict retry
        run: uv run python .github/scripts/deploy-docs.py dev --title "dev (main)"

      - name: Upload dev docs deployment log
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-docs-deploy-log
          path: ${{ env.DEPLOY_LOG }}
          if-no-files-found: warn
          retention-days: 14

  pages:
    name: Deploy documentation to GitHub Pages
    needs:
      - gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Shared with Release · Publish: every Pages deployment exports the gh-pages tip at
    # deploy time within this group, so a later deployment carries every earlier version.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read # Read the gh-pages version state.
      id-token: write # Authenticate the Pages deployment through OIDC.
      pages: write # Publish the Pages artifact.
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages
          persist-credentials: false

      - name: Export versioned Pages site
        shell: bash
        run: |
          set -euo pipefail
          pages_dir="${RUNNER_TEMP}/pages-site"
          mkdir -p "${pages_dir}"
          git -C gh-pages archive HEAD | tar -x -C "${pages_dir}"
          test -f "${pages_dir}/index.html"
          test -f "${pages_dir}/versions.json"
          if [[ -d "${pages_dir}/zh" ]]; then
            test -f "${pages_dir}/zh/versions.json"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Show dev docs URL
        env:
          DOCS_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Documentation deployed to ${DOCS_URL}dev/"
          echo "### [Open the dev documentation](${DOCS_URL}dev/)" >> "${GITHUB_STEP_SUMMARY}"
