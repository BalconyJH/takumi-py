# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

fail_fast = false
exclude = '''
(?x)^(
  takumilib/.*
  | target/.*
  | png-output/.*
  | html-fixtures/.*
)$
'''

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
    { id = "check-merge-conflict", priority = 0 },
    { id = "end-of-file-fixer", priority = 0 },
]

[[repos]]
repo = "https://github.com/abravalheri/validate-pyproject"
rev = "v0.25"
hooks = [
    { id = "validate-pyproject", priority = 0 },
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.48.0"
hooks = [
    { id = "typos", priority = 0 },
]

[[repos]]
repo = "https://github.com/rbubley/mirrors-prettier"
rev = "v3.9.6"
hooks = [
    { id = "prettier", types = ["yaml"], priority = 0 },
]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.29.0"
hooks = [
    { id = "zizmor", args = ["--pedantic"], priority = 0 },
]

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "0.37.4"
hooks = [
    { id = "check-github-workflows", priority = 0 },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.16"
hooks = [
    { id = "ruff-format", priority = 0 },
    { id = "ruff-check", args = ["--fix", "--exit-non-zero-on-fix"], types_or = ["python", "pyi"], require_serial = true, priority = 1 },
]

[[repos]]
repo = "local"
hooks = [
    { id = "cargo-fmt", name = "cargo fmt --all -- --check", entry = "cargo fmt --all -- --check", language = "system", files = "^src/.*[.]rs$", pass_filenames = false, priority = 1 },
    { id = "cargo-clippy", name = "cargo clippy --all-targets --all-features -- -D warnings", entry = "cargo clippy --all-targets --all-features -- -D warnings", language = "system", files = "^(Cargo[.]toml|Cargo[.]lock|src/.*[.]rs)$", pass_filenames = false, priority = 1 },
]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.2.0"
hooks = [
    { id = "conventional-pre-commit", stages = ["commit-msg"], args = ["build", "ci", "docs", "feat", "fix", "perf", "refactor", "revert", "style", "test"], priority = 0 },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [
    { id = "actionlint", stages = ["manual"], args = ["-ignore=SC2129", "-ignore=SC2016"], language = "golang", additional_dependencies = ["github.com/wasilibs/go-shellcheck/cmd/shellcheck@v0.11.1"], priority = 0 },
]
